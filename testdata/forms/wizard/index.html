<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Workshop registration</title>
<h1>Workshop registration</h1>
<form method="post" action="/wizard/submit">
  <section data-step="1">
    <h2>Step 1 of 3: you</h2>
    <label>Name <input name="name"></label>
    <label>Email <input name="email"></label>
    <button type="button" data-go="2">Next</button>
  </section>
  <section data-step="2" hidden>
    <h2>Step 2 of 3: the day</h2>
    <label>Day <select name="day"><option value="friday">Friday</option><option value="saturday">Saturday</option></select></label>
    <label>Lunch <select name="lunch"><option value="standard">Standard</option><option value="vegetarian">Vegetarian</option><option value="none">No lunch</option></select></label>
    <button type="button" data-go="1">Back</button>
    <button type="button" data-go="3">Next</button>
  </section>
  <section data-step="3" hidden>
    <h2>Step 3 of 3: check and send</h2>
    <p id="summary"></p>
    <button type="button" data-go="2">Back</button>
    <button>Register</button>
  </section>
</form>
<script>
  // One step shows at a time; Back keeps what was entered.
  const f = document.forms[0];
  for (const b of document.querySelectorAll("[data-go]")) b.addEventListener("click", () => {
    for (const s of document.querySelectorAll("[data-step]")) s.hidden = s.dataset.step !== b.dataset.go;
    document.getElementById("summary").textContent = `${f.name.value} (${f.email.value}), ${f.day.value}, ${f.lunch.value} lunch.`;
  });
</script>
