<svg xmlns="http://www.w3.org/2000/svg" width="700" height="620" viewBox="0 0 700 620" role="img"><title>An act step</title><desc>An act step's instruction, start URL and hosts become a question and an allowlist. pirn runs Claude's loop, bounded in turns, tool calls and time, offering it only Playwright MCP's form tools. Each call goes through podman exec to Playwright MCP in a fresh reed container, whose Chromium may reach only allowed hosts. After every action a screenshot becomes a frame heartbeated to Temporal for the run page; at the end the answer, every call with its screenshot, the final URL, the allowed and blocked hosts and how it ended are the step's output, recorded in Git. The container is then removed.</desc><style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.w{stroke:#5F5E5A;stroke-width:1.5;fill:none}.dot{fill:#5F5E5A}
.d{stroke:#888780;stroke-width:0.8;fill:none;stroke-dasharray:5 4}
.l{font-size:12px;fill:#5F5E5A}.f{font-size:13px;fill:#444441}
.t1{font-size:14px;font-weight:600}.t2{font-size:12px}
.p rect{fill:#EEEDFE;stroke:#534AB7}.p .t1{fill:#3C3489}.p .t2{fill:#534AB7}
.g rect{fill:#E1F5EE;stroke:#0F6E56}.g .t1{fill:#085041}.g .t2{fill:#0F6E56}
.c rect{fill:#FAECE7;stroke:#993C1D}.c .t1{fill:#712B13}.c .t2{fill:#993C1D}
.n rect{fill:#F1EFE8;stroke:#5F5E5A}.n .t1{fill:#444441}.n .t2{fill:#5F5E5A}
@media (prefers-color-scheme:dark){
.w{stroke:#B4B2A9}.dot{fill:#B4B2A9}.d{stroke:#888780}.l{fill:#B4B2A9}.f{fill:#D3D1C7}
.p rect{fill:#3C3489;stroke:#AFA9EC}.p .t1{fill:#EEEDFE}.p .t2{fill:#CECBF6}
.g rect{fill:#085041;stroke:#5DCAA5}.g .t1{fill:#E1F5EE}.g .t2{fill:#9FE1CB}
.c rect{fill:#712B13;stroke:#F0997B}.c .t1{fill:#FAECE7}.c .t2{fill:#F5C4B3}
.n rect{fill:#444441;stroke:#B4B2A9}.n .t1{fill:#F1EFE8}.n .t2{fill:#D3D1C7}}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text class="f" x="40" y="46" text-anchor="start">(act "Join the volunteer list" "http://forms.example.org/" "cdn.example.org")</text><path class="w" d="M150 56 L150 86"/><g class="p"><rect x="60" y="86" width="180" height="48" rx="6" stroke-width="0.8"/><text class="t1" x="150.0" y="101" text-anchor="middle" dominant-baseline="central">question</text><text class="t2" x="150.0" y="120" text-anchor="middle" dominant-baseline="central">instruction ⊗ URL ⊗ hosts</text></g><path class="w" d="M240 110 L270 110"/><rect class="d" x="270" y="74" width="390" height="96" rx="12"/><text class="l" x="282" y="68" text-anchor="start">Claude's loop (pirn): ≤ 30 turns, ≤ 60 calls, 10 min</text><g class="g"><rect x="290" y="94" width="140" height="48" rx="6" stroke-width="0.8"/><text class="t1" x="360.0" y="109" text-anchor="middle" dominant-baseline="central">Claude</text><text class="t2" x="360.0" y="128" text-anchor="middle" dominant-baseline="central">Messages API</text></g><path class="w" d="M430 118 L460 118"/><g class="n"><rect x="460" y="94" width="180" height="48" rx="6" stroke-width="0.8"/><text class="t1" x="550.0" y="109" text-anchor="middle" dominant-baseline="central">form tools only</text><text class="t2" x="550.0" y="128" text-anchor="middle" dominant-baseline="central">11 of Playwright MCP's</text></g><path class="w" d="M550 142 L550 206"/><rect class="d" x="270" y="200" width="390" height="190" rx="12"/><text class="l" x="282" y="194" text-anchor="start">fresh container (reed), removed afterwards</text><g class="n"><rect x="290" y="216" width="160" height="48" rx="6" stroke-width="0.8"/><text class="t1" x="370.0" y="231" text-anchor="middle" dominant-baseline="central">podman exec</text><text class="t2" x="370.0" y="250" text-anchor="middle" dominant-baseline="central">MCP over stdio</text></g><path class="w" d="M450 240 L470 240"/><g class="c"><rect x="470" y="216" width="170" height="48" rx="6" stroke-width="0.8"/><text class="t1" x="555.0" y="231" text-anchor="middle" dominant-baseline="central">Playwright MCP</text><text class="t2" x="555.0" y="250" text-anchor="middle" dominant-baseline="central">+ Chromium, headless</text></g><path class="w" d="M555 264 L555 290"/><g class="c"><rect x="290" y="290" width="350" height="48" rx="6" stroke-width="0.8"/><text class="t1" x="465.0" y="305" text-anchor="middle" dominant-baseline="central">allowlist, enforced by Chromium</text><text class="t2" x="465.0" y="324" text-anchor="middle" dominant-baseline="central">proxy bypass list ⊗ resolver rules</text></g><path class="w" d="M465 338 L465 350"/><g class="n"><rect x="290" y="350" width="350" height="30" rx="6" stroke-width="0.8"/><text class="t2" x="465.0" y="384" text-anchor="middle" dominant-baseline="central"></text></g><text class="t2 l" x="465" y="369" text-anchor="middle">the web: allowed hosts only</text><path class="w" d="M150 134 L150 420"/><g class="p"><rect x="60" y="420" width="180" height="48" rx="6" stroke-width="0.8"/><text class="t1" x="150.0" y="435" text-anchor="middle" dominant-baseline="central">screenshot</text><text class="t2" x="150.0" y="454" text-anchor="middle" dominant-baseline="central">after every action</text></g><path class="w" d="M240 444 L300 444"/><g class="p"><rect x="300" y="420" width="170" height="48" rx="6" stroke-width="0.8"/><text class="t1" x="385.0" y="435" text-anchor="middle" dominant-baseline="central">Temporal heartbeat</text><text class="t2" x="385.0" y="454" text-anchor="middle" dominant-baseline="central">latest frame</text></g><path class="w" d="M470 444 L500 444"/><g class="g"><rect x="500" y="420" width="150" height="48" rx="6" stroke-width="0.8"/><text class="t1" x="575.0" y="435" text-anchor="middle" dominant-baseline="central">run page</text><text class="t2" x="575.0" y="454" text-anchor="middle" dominant-baseline="central">drawdown, live</text></g><g class="p"><rect x="60" y="500" width="180" height="48" rx="6" stroke-width="0.8"/><text class="t1" x="150.0" y="515" text-anchor="middle" dominant-baseline="central">result</text><text class="t2" x="150.0" y="534" text-anchor="middle" dominant-baseline="central">answer ⊗ calls ⊗ ended</text></g><path class="w" d="M240 524 L300 524"/><g class="p"><rect x="300" y="500" width="170" height="48" rx="6" stroke-width="0.8"/><text class="t1" x="385.0" y="515" text-anchor="middle" dominant-baseline="central">step output</text><text class="t2" x="385.0" y="534" text-anchor="middle" dominant-baseline="central">strict JSON</text></g><path class="w" d="M470 524 L500 524"/><g class="g"><rect x="500" y="500" width="150" height="48" rx="6" stroke-width="0.8"/><text class="t1" x="575.0" y="515" text-anchor="middle" dominant-baseline="central">record</text><text class="t2" x="575.0" y="534" text-anchor="middle" dominant-baseline="central">warp · Git</text></g><text class="f" x="340" y="590" text-anchor="middle">act = question ; (Claude ; tool ; screenshot)* ; (heartbeat ⊗ record)</text></svg>
