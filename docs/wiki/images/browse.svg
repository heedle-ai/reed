<svg xmlns="http://www.w3.org/2000/svg" width="680" height="560" viewBox="0 0 680 560" role="img"><title>A browse step in reed</title><desc>The browse step's arguments become a visit and its allowlist. A fresh container runs Chromium. reed drives it over the DevTools protocol through podman exec and socat inside the container; no port is published. Chromium may reach only allowed hosts: everything else goes to a proxy that doesn't exist, and only allowed names resolve. While it runs, frames are heartbeated to Temporal for the agent's tab; at the end the page it saw is the step's output, recorded in Git. The container is then removed.</desc><style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.w{stroke:#5F5E5A;stroke-width:1.5;fill:none}.dot{fill:#5F5E5A}
.d{stroke:#888780;stroke-width:0.8;fill:none;stroke-dasharray:5 4}
.l{font-size:12px;fill:#5F5E5A}.f{font-size:13px;fill:#444441}
.t1{font-size:14px;font-weight:600}.t2{font-size:12px}
.p rect{fill:#EEEDFE;stroke:#534AB7}.p .t1{fill:#3C3489}.p .t2{fill:#534AB7}
.g rect{fill:#E1F5EE;stroke:#0F6E56}.g .t1{fill:#085041}.g .t2{fill:#0F6E56}
.c rect{fill:#FAECE7;stroke:#993C1D}.c .t1{fill:#712B13}.c .t2{fill:#993C1D}
.n rect{fill:#F1EFE8;stroke:#5F5E5A}.n .t1{fill:#444441}.n .t2{fill:#5F5E5A}
@media (prefers-color-scheme:dark){
.w{stroke:#B4B2A9}.dot{fill:#B4B2A9}.d{stroke:#888780}.l{fill:#B4B2A9}.f{fill:#D3D1C7}
.p rect{fill:#3C3489;stroke:#AFA9EC}.p .t1{fill:#EEEDFE}.p .t2{fill:#CECBF6}
.g rect{fill:#085041;stroke:#5DCAA5}.g .t1{fill:#E1F5EE}.g .t2{fill:#9FE1CB}
.c rect{fill:#712B13;stroke:#F0997B}.c .t1{fill:#FAECE7}.c .t2{fill:#F5C4B3}
.n rect{fill:#444441;stroke:#B4B2A9}.n .t1{fill:#F1EFE8}.n .t2{fill:#D3D1C7}}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text class="f" x="40" y="46" text-anchor="start">(browse "https://a.example/p" "cdn.example")</text><path class="w" d="M150 56 L150 86"/><g class="p"><rect x="60" y="86" width="180" height="48" rx="6" stroke-width="0.8"/><text class="t1" x="150.0" y="101.0" text-anchor="middle" dominant-baseline="central">visit</text><text class="t2" x="150.0" y="120.0" text-anchor="middle" dominant-baseline="central">URL ⊗ allowlist</text></g><path class="w" d="M240 110 L300 110"/><rect class="d" x="300" y="70" width="350" height="250" rx="12"/><text class="l" x="312" y="64" text-anchor="start">fresh container, removed afterwards</text><g class="n"><rect x="320" y="86" width="150" height="48" rx="6" stroke-width="0.8"/><text class="t1" x="395.0" y="101.0" text-anchor="middle" dominant-baseline="central">podman exec</text><text class="t2" x="395.0" y="120.0" text-anchor="middle" dominant-baseline="central">socat, no open port</text></g><g class="c"><rect x="490" y="86" width="140" height="48" rx="6" stroke-width="0.8"/><text class="t1" x="560.0" y="101.0" text-anchor="middle" dominant-baseline="central">Chromium</text><text class="t2" x="560.0" y="120.0" text-anchor="middle" dominant-baseline="central">headless</text></g><path class="w" d="M470 110 L490 110"/><g class="c"><rect x="320" y="170" width="310" height="56" rx="6" stroke-width="0.8"/><text class="t1" x="475.0" y="189.0" text-anchor="middle" dominant-baseline="central">allowlist, enforced by Chromium</text><text class="t2" x="475.0" y="208.0" text-anchor="middle" dominant-baseline="central">proxy bypass list ⊗ resolver rules</text></g><path class="w" d="M560 134 L560 170"/><g class="n"><rect x="320" y="246" width="310" height="48" rx="6" stroke-width="0.8"/><text class="t1" x="475.0" y="261.0" text-anchor="middle" dominant-baseline="central">the web</text><text class="t2" x="475.0" y="280.0" text-anchor="middle" dominant-baseline="central">allowed hosts only</text></g><path class="w" d="M475 226 L475 246"/><path class="w" d="M150 134 L150 360"/><g class="p"><rect x="60" y="360" width="180" height="48" rx="6" stroke-width="0.8"/><text class="t1" x="150.0" y="375.0" text-anchor="middle" dominant-baseline="central">frames</text><text class="t2" x="150.0" y="394.0" text-anchor="middle" dominant-baseline="central">every 2 s</text></g><path class="w" d="M240 384 L300 384"/><g class="p"><rect x="300" y="360" width="170" height="48" rx="6" stroke-width="0.8"/><text class="t1" x="385.0" y="375.0" text-anchor="middle" dominant-baseline="central">Temporal heartbeat</text><text class="t2" x="385.0" y="394.0" text-anchor="middle" dominant-baseline="central">latest frame</text></g><path class="w" d="M470 384 L500 384"/><g class="g"><rect x="500" y="360" width="150" height="48" rx="6" stroke-width="0.8"/><text class="t1" x="575.0" y="375.0" text-anchor="middle" dominant-baseline="central">agent's tab</text><text class="t2" x="575.0" y="394.0" text-anchor="middle" dominant-baseline="central">drawdown, live</text></g><g class="p"><rect x="60" y="440" width="180" height="48" rx="6" stroke-width="0.8"/><text class="t1" x="150.0" y="455.0" text-anchor="middle" dominant-baseline="central">page</text><text class="t2" x="150.0" y="474.0" text-anchor="middle" dominant-baseline="central">text ⊗ screenshot</text></g><path class="w" d="M240 464 L300 464"/><g class="p"><rect x="300" y="440" width="170" height="48" rx="6" stroke-width="0.8"/><text class="t1" x="385.0" y="455.0" text-anchor="middle" dominant-baseline="central">step output</text><text class="t2" x="385.0" y="474.0" text-anchor="middle" dominant-baseline="central">JSON</text></g><path class="w" d="M470 464 L500 464"/><g class="g"><rect x="500" y="440" width="150" height="48" rx="6" stroke-width="0.8"/><text class="t1" x="575.0" y="455.0" text-anchor="middle" dominant-baseline="central">record</text><text class="t2" x="575.0" y="474.0" text-anchor="middle" dominant-baseline="central">warp · Git</text></g><text class="f" x="340" y="530" text-anchor="middle">browse = visit ; (frames ⊗ page) ; (heartbeat ⊗ record)   ·   the Git store is outside every container</text></svg>
