name: Spike 9.5

# Temporary (roadmap 9.5): runs Playwright MCP against Debian bookworm's
# Chromium, in the Debian container image.yml pins, and drives a two-page
# local form over stdio. Results are annotations. Removed once reported.

on:
  push:
    branches: [roadmap/9.5-browser-agent]
    paths: ['.github/workflows/spike-9.5.yml', 'testdata/spike/**']
  # round 3: reed's host resolver rules exclude the allowed address, as ChromiumFlags does

permissions:
  contents: read

env:
  DEBIAN: docker.io/library/debian@sha256:99c0b25c46d0214d5a2091092e7908907dcaecd6a962cde0ac700acee222b6f3
  MCP: "@playwright/mcp@0.0.84"
  NODE: "22.21.1"

jobs:
  spike:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64, narch: x64 }
          - { runner: ubuntu-24.04-arm, arch: arm64, narch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: decoy
        # A server outside the container that counts every request reaching it.
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/decoy.py" <<'PY'
          import http.server, sys
          class H(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  open(sys.argv[1], "a").write(self.path + "\n"); self.send_response(200); self.end_headers(); self.wfile.write(b"decoy")
              def log_message(self, *a): pass
          http.server.ThreadingHTTPServer(("0.0.0.0", 8099), H).serve_forever()
          PY
          : > "$RUNNER_TEMP/decoy.log"
          nohup python3 "$RUNNER_TEMP/decoy.py" "$RUNNER_TEMP/decoy.log" >/dev/null 2>&1 &
          sleep 1
          curl -fsS http://127.0.0.1:8099/selftest && : > "$RUNNER_TEMP/decoy.log"
          echo "DECOY_IP=$(docker network inspect bridge -f '{{(index .IPAM.Config 0).Gateway}}')" >> "$GITHUB_ENV"
      - name: drive
        shell: bash
        run: |
          docker run --rm -v "$PWD/testdata/spike:/spike:ro" -e MCP -e NODE -e NARCH=${{ matrix.narch }} -e ARCH=${{ matrix.arch }} -e DECOY="http://$DECOY_IP:8099" "$DEBIAN" bash -c '
            set -uo pipefail
            note() { echo "::notice title=spike2-$ARCH $1::$2"; }
            apt-get update -q >/dev/null
            apt-get install -y -q --no-install-recommends chromium ca-certificates curl xz-utils fonts-dejavu-core >/dev/null
            note chromium "$(/usr/lib/chromium/chromium --version 2>&1 | head -1)"
            mkdir -p /opt/spike && cd /opt/spike
            f=node-v$NODE-linux-$NARCH.tar.xz
            curl -fsSLO https://nodejs.org/dist/v$NODE/$f && curl -fsSL https://nodejs.org/dist/v$NODE/SHASUMS256.txt | grep " $f\$" | sha256sum -c - >/dev/null && tar -xJf $f && rm $f
            export PATH=/opt/spike/node-v$NODE-linux-$NARCH/bin:$PATH
            npm install --no-save --ignore-scripts "$MCP" @modelcontextprotocol/sdk@1 >/dev/null 2>&1 || note npm "install failed"
            cp /spike/drive2.mjs /opt/spike/
            useradd -m reed; chmod -R a+rX /opt/spike
            for mode in launch cdp; do for allow in yes no; do
              out=$(su reed -s /bin/bash -c "cd /opt/spike && PATH=$PATH timeout 180 node drive2.mjs $mode /usr/lib/chromium/chromium /opt/spike/node_modules/@playwright/mcp/cli.js $allow $DECOY" 2>&1)
              r=$(echo "$out" | grep "^RESULT " | tail -1)
              note "$mode allow=$allow" "${r:-no result: $(echo "$out" | tail -5 | tr "\n" " " | cut -c1-600)}"
            done; done
          '
          echo "::notice title=spike2-${{ matrix.arch }} decoy hits::$(wc -l < "$RUNNER_TEMP/decoy.log") $(head -5 "$RUNNER_TEMP/decoy.log" | tr '\n' ' ')"
