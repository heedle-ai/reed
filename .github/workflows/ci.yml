name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    # bash -eo pipefail: a failing command in a pipe fails the step
    # (the default, bash -e, ignores it).
    shell: bash

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]   # Linux amd64, Linux arm64, macOS Apple Silicon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: reed
      - uses: actions/checkout@v4      # go.mod replaces the heedle-ai modules with ../
        with:
          repository: heedle-ai/weft
          path: weft
      - uses: actions/checkout@v4
        with:
          repository: heedle-ai/shuttle
          path: shuttle
      - uses: actions/checkout@v4
        with:
          repository: heedle-ai/draft
          path: draft
      - uses: actions/setup-go@v5
        with:
          go-version-file: reed/go.mod
          cache-dependency-path: reed/go.sum
      - name: gofmt
        working-directory: reed
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        working-directory: reed
        run: go vet ./...
      - name: test
        working-directory: reed
        run: go test -race ./...
      - name: invariants
        working-directory: reed
        run: bash .github/invariants.sh
      # GitHub's Linux runners have Podman and Google Chrome; macOS runners
      # have no container engine. Here the browser image is built from the
      # runner's Chrome, and the container tests must run: skipping fails.
      - uses: actions/setup-node@v4        # Node for the browser-agent image (roadmap 9.5)
        if: matrix.os == 'ubuntu-latest'
        with:
          node-version: "22.21.1"
      - name: containers
        if: matrix.os == 'ubuntu-latest'
        working-directory: reed
        env:
          REED_REQUIRE_PODMAN: "1"
        run: |
          sudo apt-get install -y socat >/dev/null
          podman --version
          google-chrome --version
          REED_IMAGE=$(bash scripts/build-image.sh)   # fails the step if the build fails
          export REED_IMAGE
          (cd agent && npm ci --ignore-scripts --no-audit --no-fund)
          REED_ACT_IMAGE=$(BUILD_IMAGE_NODE="$(dirname "$(dirname "$(command -v node)")")" BUILD_IMAGE_MCP="$PWD/agent" bash scripts/build-image.sh)
          export REED_ACT_IMAGE
          go test -count=1 -v -run 'TestContainer_' . | tee containers.log
          if grep -q -- '--- SKIP' containers.log; then echo 'a test skipped'; exit 1; fi
          grep -q -- '--- PASS: TestContainer_OnlyAllowedHostsAreReached' containers.log
          grep -q -- '--- PASS: TestContainer_EveryVisitStartsClean' containers.log
          grep -q -- '--- PASS: TestContainer_InAProgram' containers.log
          grep -q -- '--- PASS: TestContainer_DevToolsIsNotExposed' containers.log
          grep -q -- '--- PASS: TestContainer_OutputsAreBounded' containers.log
          grep -q -- '--- PASS: TestContainer_ResolvePinsHosts' containers.log
          grep -q -- '--- PASS: TestContainer_ActOnlyAllowedHostsAreReached' containers.log
          grep -q -- '--- PASS: TestContainer_ActFillsAForm' containers.log
          grep -q -- '--- PASS: TestContainer_ActServerIsPinned' containers.log
          grep -q -- '--- PASS: TestContainer_ActSessionsAreTheirOwn' containers.log
          grep -q -- '--- PASS: TestContainer_CourseInjectionReachesNothing' containers.log
          grep -q -- '--- PASS: TestContainer_ActHoldsFormsUntilConfirmed' containers.log
